name: build

# Costruisce l'immagine e la pubblica su GHCR.
# Su dkct basta `docker compose pull && docker compose up -d`: nessun clone, nessuna build.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Prima di costruire: il codice si carica e le regole di esempio sono valide?
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Sintassi di tutti i sorgenti
        run: for f in src/*.js; do node --check "$f"; done

      - name: Le regole di esempio si caricano e il motore risponde
        run: node src/index.js --simulate fixtures/sample-text.json --config config/rules.example.yaml

      - name: Azioni Home Assistant contro il finto HA
        run: |
          node tools/mock-ha.mjs 8199 > /tmp/mock-ha.log 2>&1 &
          MOCK_PID=$!
          sleep 2
          export HA_URL=http://127.0.0.1:8199
          export HA_TOKEN=prova
          node src/index.js --check --config fixtures/ha-actions.yaml
          node src/index.js --simulate fixtures/sample-text.json --config fixtures/ha-actions.yaml --live
          kill "$MOCK_PID"
          echo "--- chiamate ricevute ---"
          cat /tmp/mock-ha.log

      - name: Pannello web
        run: node tools/web-smoke.mjs

      - name: Editor del pannello
        run: node tools/editor-test.mjs

      - name: Motore delle regole
        run: node tools/rules-test.mjs

  build:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sulle PR non si pubblica niente: solo verifica che l'immagine si costruisca
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
