# ==============================================================
#  wa-categorizer on dkct — lives in /data/stacks/wa-categorizer/
#
#  Layout on the server:
#    /data/stacks/wa-categorizer/
#    ├─ compose.yaml   this file (editable from the Dockhand panel)
#    ├─ .env           SECRETS ONLY — see below
#    ├─ config/        rules.yaml, bind-mounted: reloads live
#    └─ data/          WhatsApp session, logs, media, contacts
#
#  Why there is no `build:` here: the Hawser agent on this host runs with
#  ProtectHome=true (see its systemd unit), so /root is read-only and buildx
#  cannot create /root/.docker. `pull` works fine. The image therefore
#  arrives prebuilt from GitHub Actions via GHCR.
# ==============================================================

services:
  wa-categorizer:
    image: ghcr.io/cchrkk/wa-categorizer:latest
    pull_policy: always
    container_name: wa-categorizer
    restart: unless-stopped

    # tini is already the image entrypoint: signals reach node, so rules,
    # contacts and state are saved before the process exits.
    stop_grace_period: 20s

    # --- secrets: they stay in .env, next to this file ---
    #     OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HA_TOKEN,
    #     WEB_TOKEN, HA_URL (an internal address)
    env_file:
      - .env

    # --- everything else here: visible and editable from Dockhand ---
    environment:
      DATA_DIR: /app/data
      AUTH_DIR: /app/data/auth
      TZ: Europe/Rome
      LOG_PRETTY: "false"
      LOG_LEVEL: info

      # transcription (the key lives in .env)
      TRANSCRIBE_BACKEND: openai
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      OPENAI_TRANSCRIBE_MODEL: whisper-large-v3-turbo
      OPENAI_CLASSIFY_MODEL: openai/gpt-oss-120b
      TRANSCRIBE_LANGUAGE: it

      # web panel. The process always runs: what you switch on and off is
      # where the port is published (the `ports:` line below), not this.
      WEB_ENABLED: "true"
      WEB_BIND: 0.0.0.0

    # --- THE PANEL SWITCH ---
    # Change 0.0.0.0 to 127.0.0.1 and press "Save & redeploy":
    #   0.0.0.0:8099:8099     reachable on the office LAN
    #   127.0.0.1:8099:8099   inside this host only -> effectively off
    # Docker bypasses UFW: when it is 0.0.0.0 the only thing in the way is
    # the WEB_TOKEN in .env. Do not remove it.
    #
    # The switch lives here and not in .env on purpose: the env file is
    # written by the management panel, so an SSH edit would be wiped on the
    # next deploy.
    ports:
      - "0.0.0.0:8099:8099"

    volumes:
      # WhatsApp session, logs, media, contacts
      - ./data:/app/data
      # rules outside the image: reload live, no rebuild
      - ./config:/app/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
