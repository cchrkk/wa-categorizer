# ==============================================================
#  wa-categorizer su dkct — vive in /data/stacks/wa-categorizer/
#
#  Layout sul server:
#    /data/stacks/wa-categorizer/
#    ├─ compose.yaml   questo file (modificabile dal pannello di Dockhand)
#    ├─ .env           SOLO segreti — vedi sotto
#    ├─ config/        rules.yaml, bind-montato: si ricarica a caldo
#    └─ data/          sessione WhatsApp, log, media, rubrica
#
#  Perché non c'è un `build:`: l'agent Hawser di dkct gira con
#  ProtectHome=true (vedi la sua unit systemd), quindi /root è read-only e
#  buildx non riesce a creare /root/.docker. Il `pull` invece funziona.
#  Quindi l'immagine arriva già costruita da GitHub Actions su GHCR.
# ==============================================================

services:
  wa-categorizer:
    image: ghcr.io/cchrkk/wa-categorizer:latest
    pull_policy: always
    container_name: wa-categorizer
    restart: unless-stopped

    # tini è già l'entrypoint dell'immagine: i segnali arrivano a node e il
    # salvataggio di rubrica, stato e regole va a termine prima di uscire.
    stop_grace_period: 20s

    # --- segreti: restano nel .env, accanto a questo file ---
    #     OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HA_TOKEN,
    #     WEB_TOKEN, HA_URL (indirizzo interno)
    env_file:
      - .env

    # --- tutto il resto qui: così è visibile e modificabile da Dockhand ---
    environment:
      DATA_DIR: /app/data
      AUTH_DIR: /app/data/auth
      TZ: Europe/Rome
      LOG_PRETTY: "false"
      LOG_LEVEL: info

      # trascrizione (la chiave sta nel .env)
      TRANSCRIBE_BACKEND: openai
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      OPENAI_TRANSCRIBE_MODEL: whisper-large-v3-turbo
      OPENAI_CLASSIFY_MODEL: openai/gpt-oss-120b
      TRANSCRIBE_LANGUAGE: it

      # pannello web. Se lo metti a "false", commenta anche `ports:` qui sotto:
      # altrimenti resta una porta pubblicata su tutta la LAN con niente dietro.
      WEB_ENABLED: "true"
      WEB_BIND: 0.0.0.0

    # Docker bypassa UFW: questa porta non è filtrata da niente. Il WEB_TOKEN
    # nel .env è l'unica cosa in mezzo, non toglierlo.
    ports:
      - "8099:8099"

    volumes:
      # sessione WhatsApp + log + media + rubrica
      - ./data:/app/data
      # regole fuori dall'immagine: ricarica a caldo, niente rebuild
      - ./config:/app/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
