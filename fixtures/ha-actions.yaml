# Test file for `tools/mock-ha.mjs`: contains every Home Assistant action.
#   node tools/mock-ha.mjs 8199
#   HA_URL=http://127.0.0.1:8199 HA_TOKEN=test \
#     node src/index.js --simulate fixtures/sample-text.json \
#     --config fixtures/ha-actions.yaml --live

settings:
  transcribeAudio: false
  logMessages: false
  mediaRetentionDays: -1

rules:
  - id: test-ha-actions
    name: "Test: every Home Assistant action"
    enabled: true
    match:
      type: text

    actions:
      # 1. press a button
      - type: ha.button
        button: button.doorbell

      # 2. run a script with variables (placeholders work in there too)
      - type: ha.script
        script: script.notify_order
        variables:
          text: "{{content}}"
          from: "{{sender}}"
          chat: "{{chat}}"
          jid: "{{senderJid}}"
          when: "{{date}}"

      # 3. run a script and wait for its response
      - type: ha.script
        script: script.with_response
        wait: true
        variables:
          question: "{{content}}"

      # 4. trigger an automation
      - type: ha.automation
        automation: gate

      # 5. phone notification (shortcut for notify.*)
      - type: ha.notify
        service: mobile_app_my_phone
        title: "Order from {{sender}}"
        message: "{{content}}"

      # 6. generic service, with entity_id and data
      - type: ha.service
        domain: light
        service: turn_on
        entityId: light.living_room
        data:
          brightness_pct: 60
          rgb_color: [255, 200, 0]

      # 7. generic action on an entity: the domain comes from the entity_id
      - type: ha.action
        entityId: switch.machine_plug
        action: toggle
