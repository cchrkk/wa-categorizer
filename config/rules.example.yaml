# ==============================================================
#  wa-categorizer — regole (ESEMPIO MINIMO)
#
#  Copialo in rules.yaml e modificatelo:
#      copy config\rules.example.yaml config\rules.yaml
#
#  Questo file serve a partire: ha solo le impostazioni e due regole
#  funzionanti. Per gli altri casi (tutti i messaggi di una persona,
#  filtri per parola, gruppi, classificazione LLM, comandi per casa,
#  documenti...) guarda la cartella `examples/`:
#  ogni caso è un file a sé, con il titolo che dice cosa fa, e si copia
#  direttamente in `config/rules.d/` senza incollare niente.
#
#  Salvi e le regole si ricaricano da sole: niente riavvio.
#    npm run check       valida quello che hai scritto
#    npm run simulate    prova un messaggio finto, senza toccare WhatsApp
#    npm run contacts    jid, LID e nomi che il programma conosce
#
#  Segnaposto usabili nelle stringhe:
#    {{content}}  il testo, o la trascrizione se è un vocale  (il più usato)
#    {{text}} {{transcript}} {{chat}} {{chatJid}} {{sender}} {{senderJid}}
#    {{rule}} {{ruleName}} {{type}} {{label}} {{confidence}}
#    {{fileName}} {{seconds}} {{date}}
#    {{1}} {{2}}... e {{nomeGruppo}}: parole prese dalla regex
# ==============================================================

settings:
  # Scarica e trascrive i vocali (Groq / whisper locale, vedi .env)
  transcribeAudio: true
  # Log di tutti i messaggi in data/messages.jsonl
  logMessages: true
  # true = processa anche i messaggi che scrivi TU (serve per i comandi casa)
  processOwnMessages: false
  # azione "shell" (esegue comandi locali): da lasciare false
  allowShell: false
  # Quanto tenere i media scaricati in data/out/ (in giorni):
  #   > 0  N giorni | 0  li cancella subito | -1  mai
  mediaRetentionDays: 7


rules:

  # ------------------------------------------------------------
  # Ordini scritti: una quantità seguita da un prodotto
  # ------------------------------------------------------------
  - id: ordini-scritti
    name: "Ordini — testo con quantità"
    priority: 10
    enabled: true

    match:
      chatName: Ordini
      type: text
      textMatch:
        mode: regex
        # flags: iu serve per i confini unicode. Con '\b...\b' (solo ASCII)
        # una parola accentata non matcherebbe mai: `npm run check` avvisa.
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(?:\d+|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci)\s+(casse|cartoni|bottiglie|pezzi|kg|chili)(?![\p{L}\p{N}])'

    actions:
      - type: appendJsonl
        file: data/ordini.jsonl
      - type: notify.telegram
        message: |
          📝 Ordine in {{chat}} da {{sender}}:
          {{text}}

  # ------------------------------------------------------------
  # Ordini a voce: stessa idea, ma la trascrizione scrive i numeri a
  # parole ("tre casse"), quindi qui NON si può pretendere la cifra.
  # ------------------------------------------------------------
  - id: ordini-vocali
    name: "Ordini — vocali con parole chiave"
    priority: 11
    enabled: true

    match:
      chatName: Ordini
      type: audio
      textMatch:
        mode: regex
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(casse|cartoni|bottiglie|pezzi|kg|chili|porta\w*)(?![\p{L}\p{N}])'

    transcribe: true

    actions:
      - type: appendJsonl
        file: data/ordini.jsonl
      - type: notify.telegram
        message: |
          🎙️ Ordine vocale in {{chat}} da {{sender}}:
          {{transcript}}
