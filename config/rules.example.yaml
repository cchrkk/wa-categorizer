# ==============================================================
#  wafflow — rules (MINIMAL EXAMPLE)
#
#  Copy it to rules.yaml and edit it:
#      cp config/rules.example.yaml config/rules.yaml
#
#  This file is a starting point: settings plus two working rules.
#  For everything else (every message from one person, keyword filters,
#  groups, LLM classification, home commands, documents...) look at the
#  `examples/` folder: each case is its own file, titled with what it does,
#  and can be copied straight into `config/rules.d/` with nothing to paste.
#
#  Save it and the rules reload by themselves: no restart needed.
#    npm run check       validates what you wrote
#    npm run simulate    runs a fake message, without touching WhatsApp
#    npm run contacts    jids, LIDs and names the program knows
#
#  PLACEHOLDERS AVAILABLE IN STRINGS
#    {{content}}  the text, or the transcript for a voice note  (most used)
#    {{text}} {{transcript}} {{chat}} {{chatJid}} {{sender}} {{senderJid}}
#    {{rule}} {{ruleName}} {{type}} {{label}} {{confidence}}
#    {{fileName}} {{seconds}} {{date}}
#    {{1}} {{2}}... and {{namedGroup}}: words taken from the regex
# ==============================================================

settings:
  # Download and transcribe voice notes (Groq / local whisper, see .env)
  transcribeAudio: true
  # Log every message to data/messages.jsonl
  logMessages: true
  # true = also process messages YOU send (needed for the home commands)
  processOwnMessages: false
  # "shell" action (runs local commands): leave it false
  allowShell: false
  # How long to keep downloaded media in data/out/ (days):
  #   > 0  N days | 0  delete right after processing | -1  never
  mediaRetentionDays: 7


rules:

  # ------------------------------------------------------------
  # Written orders: a quantity followed by a product
  # ------------------------------------------------------------
  - id: orders-text
    name: "Orders — text with a quantity"
    priority: 10
    enabled: true

    match:
      chatName: Orders
      type: text
      textMatch:
        mode: regex
        # flags: iu enables Unicode boundaries. With '\b...\b' (ASCII only)
        # an accented word would never match: `npm run check` warns about it.
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+(boxes|cartons|bottles|pallets|kg|pounds)(?![\p{L}\p{N}])'

    actions:
      - type: appendJsonl
        file: data/orders.jsonl
      - type: notify.telegram
        message: |
          📝 Order in {{chat}} from {{sender}}:
          {{text}}

  # ------------------------------------------------------------
  # Voice orders: same idea, but the transcript spells numbers out
  # ("three boxes"), so here you cannot demand a digit.
  # ------------------------------------------------------------
  - id: orders-voice
    name: "Orders — voice notes with keywords"
    priority: 11
    enabled: true

    match:
      chatName: Orders
      type: audio
      textMatch:
        mode: regex
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(boxes|cartons|bottles|pallets|kg|bring\w*)(?![\p{L}\p{N}])'

    transcribe: true

    actions:
      - type: appendJsonl
        file: data/orders.jsonl
      - type: notify.telegram
        message: |
          🎙️ Voice order in {{chat}} from {{sender}}:
          {{transcript}}
