# ============================================================
#  MODERATION: LINKS IN GROUPS
#
#  Does nothing on WhatsApp (the project is read-only): it sends the link
#  to a webhook of yours, which decides what to do with it.
#
#  The payload, if you don't write `body`, carries the whole context:
#  chat, sender, text, type, transcript, date.
# ============================================================

rules:
  - id: links-in-groups
    name: "Links in groups"
    priority: 120
    enabled: false

    match:
      isGroup: true
      type: text
      textMatch:
        mode: regex
        patterns: ['https?://', 'www\.', 't\.me/']

    actions:
      # full payload, convenient when the receiver is yours
      - type: webhook
        url: https://example.com/hook
        headers:
          Authorization: "Bearer {{rule}}"
        body:
          reason: link
          chat: "{{chat}}"
          chatJid: "{{chatJid}}"
          from: "{{sender}}"
          fromJid: "{{senderJid}}"
          text: "{{text}}"
          when: "{{date}}"

      # alternatively, a Home Assistant webhook
      # - type: ha.webhook
      #   webhookId: wa_link

    # Hide the report in a log instead of sending it anywhere:
    #   - type: notify.console
    #     message: "🔗 {{sender}} in {{chat}}: {{text}}"
