# ============================================================
#  OGNI VOCALE DA UNA PERSONA
#
#  Il vocale viene trascritto e il testo passato avanti.
#  Nessun filtro: qualsiasi vocale, anche se dura due secondi.
#
#  Nota: la trascrizione la paghi (Groq o il tuo whisper locale), quindi
#  questa regola consuma a ogni vocale. Se hai tanti vocali inutili,
#  aggiungi un filtro come nell'esempio 03.
# ============================================================

rules:
  - id: ogni-vocale-da-mario
    name: "Mario — ogni vocale, trascritto"
    priority: 100
    enabled: false

    match:
      chatName: Mario
      type: audio              # audio = vocale o file audio

    # trascrive PRIMA delle azioni: dentro le azioni usi {{transcript}}
    transcribe: true

    actions:
      - type: notify.telegram
        message: |
          🎙️ Voce da {{sender}}
          {{transcript}}

      - type: appendJsonl
        file: data/vocali-mario.jsonl

    # Per provarlo senza aspettare un vocale vero, dal pannello web puoi
    # trascinare un file audio qualsiasi nel campo di prova.

    # `ptt: true` restringe ai soli vocali (push-to-talk) e lascia fuori i
    # file audio veri e propri, se ti serve distinguerli:
    #   type: audio
    #   ptt: true
