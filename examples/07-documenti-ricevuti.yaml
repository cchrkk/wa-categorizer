# ============================================================
#  DOCUMENTI E ALLEGATI RICEVUTI
#
#  PDF, preventivi, fatture: quello che ti arriva come file.
#  {{fileName}} è il nome del file, {{content}} l'eventuale didascalia
#  scritta insieme all'allegato.
#
#  Il file NON viene scaricato su disco: qui passano solo i metadati
#  (nome, mittente, didascalia) e si può notificare o archiviare.
# ============================================================

rules:
  - id: documenti-ricevuti
    name: "Documenti ricevuti"
    priority: 95
    enabled: false

    match:
      chatName: Fornitore
      type: document

    actions:
      - type: notify.telegram
        message: |
          📄 *{{fileName}}* da {{sender}} ({{chat}})
          {{content}}
      - type: appendJsonl
        file: data/documenti.jsonl

    # Filtra solo i PDF, se dalla stessa chat ti arrivano anche altre cose:
    #   mediaMimetype: application/pdf
    #
    # Solo immagini (foto, screenshot):
    #   type: image
    #
    # Tutti i media insieme, senza distinzione:
    #   type: media
    #
    # Tutto quello che non è testo né vocale:
    #   type: [image, video, document, sticker]
