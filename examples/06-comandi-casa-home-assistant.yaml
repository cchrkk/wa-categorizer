# ============================================================
#  COMANDI PER CASA SCRITTI A TE STESSO
#
#  Ti scrivi "accendi la luce della cameretta" (a voce o per iscritto) e
#  parte light.turn_on su light.cameretta.
#
#  La parola "cameretta" viene presa dal messaggio con un gruppo di
#  cattura della regex, `(?<stanza>...)`, e riusata nell'azione come
#  {{stanza}}. Vale anche per gli altri segnaposto numerati: {{1}}, {{2}}...
#
#  RICHIEDE in config/rules.yaml:
#      settings:
#        processOwnMessages: true
#  senza quello i tuoi messaggi vengono ignorati.
# ============================================================

rules:
  - id: casa-accendi-luce
    name: "Casa — «accendi luce <stanza>»"
    priority: 5
    enabled: false

    match:
      senderJid: "@me"            # "@me" = il tuo account, in qualunque forma
      type: [text, audio]         # scritto o dettato
      textMatch:
        mode: regex
        flags: iu
        patterns:
          # (?<stanza>[\p{L}]+) = una o più lettere, accenti inclusi
          # (?<![\p{L}\p{N}]) ... (?![\p{L}\p{N}]) = confini unicode, così
          # non prende "riaccendi" né "cameretta2"
          - '(?<![\p{L}\p{N}])accendi (?:la )?luce (?:di |della |del |in )?(?<stanza>[\p{L}]+)(?![\p{L}\p{N}])'

    transcribe: true

    actions:
      - type: ha.action
        entityId: "light.{{stanza}}"     # -> light.cameretta
        action: turn_on
      - type: notify.console
        message: "💡 accesa: light.{{stanza}}"

  - id: casa-spegni-luce
    name: "Casa — «spegni luce <stanza>»"
    priority: 6
    enabled: false

    match:
      senderJid: "@me"
      type: [text, audio]
      textMatch:
        mode: regex
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(?:spegni|spegnere|chiudi) (?:la )?luce (?:di |della |del |in )?(?<stanza>[\p{L}]+)(?![\p{L}\p{N}])'

    transcribe: true

    actions:
      - type: ha.action
        entityId: "light.{{stanza}}"
        action: turn_off
      - type: notify.console
        message: "🌑 spenta: light.{{stanza}}"

  # ------------------------------------------------------------
  # ALTRI COMANDI DELLO STESSO TIPO
  #
  # Interruttori invece di luci (il dominio si ricava dall'entityId):
  #   - type: ha.action
  #     entityId: "switch.{{stanza}}"
  #     action: toggle
  #
  # Uno script che decide lui, passandogli la frase intera:
  #   - type: ha.script
  #     script: script.casa_comandi
  #     variables:
  #       frase: "{{content}}"
  #       stanza: "{{stanza}}"
  #       chi: "{{sender}}"
  #
  # Preme un bottone (es. "suona campanello"):
  #   - type: ha.button
  #     button: button.campanello
  #
  # Attiva un'automazione:
  #   - type: ha.automation
  #     automation: cancello
  #
  # PER PROVARLO senza toccare la casa vera:
  #   node tools/mock-ha.mjs 8199
  #   HA_URL=http://127.0.0.1:8199 HA_TOKEN=prova \
  #     node src/index.js --simulate fixtures/casa.json \
  #     --config fixtures/comandi-casa.yaml --live
  # ------------------------------------------------------------
