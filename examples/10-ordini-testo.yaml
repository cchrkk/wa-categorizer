# ============================================================
#  CHAT ORDINI: MESSAGGI SCRITTI
#
#  Il caso classico. La differenza con l'esempio 11 (vocali) è solo
#  `type: text`: la logica di match è la stessa, ma qui si può
#  pretendere una quantità, perché un ordine scritto la contiene quasi
#  sempre in cifre.
# ============================================================

rules:
  - id: ordini-scritti
    name: "Ordini — testo con quantità"
    priority: 10
    enabled: false

    match:
      chatName: Ordini
      type: text
      textMatch:
        mode: regex
        flags: iu
        patterns:
          # una cifra, oppure il numero a parole ("tre"), seguita da un
          # prodotto. I confini unicode evitano che "casse" venga preso
          # dentro un'altra parola.
          - '(?<![\p{L}\p{N}])(?:\d+|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci)\s+(casse|cartoni|bottiglie|pezzi|kg|chili)(?![\p{L}\p{N}])'

    actions:
      - type: appendJsonl
        file: data/ordini.jsonl
      - type: notify.telegram
        message: |
          📝 Ordine in {{chat}} da {{sender}}:
          {{text}}

    # ------------------------------------------------------------
    # SE BASTA LA PAROLA, SENZA QUANTITÀ
    #
    # Spesso un ordine arriva come "portate 10 di quello": c'è la cifra,
    # ma la parola chiave sta PRIMA. Con '(?:\d+|...)\s+(prodotto)' non
    # matcherebbe mai.
    #
    # Con `contains` non hai questo problema, ma perdi la parola intera
    # ("oro" entrerebbe in "lavoro"). Se ti serve la parola intera e
    # l'ordine è libero, usa una regex senza la cifra davanti:
    #
    #   textMatch:
    #     mode: regex
    #     flags: iu
    #     patterns: ['(?<![\p{L}\p{N}])(casse|cartoni|porta\w*|confezioni)(?![\p{L}\p{N}])']
    #
    # Regola generale: sui testi SCRITTI puoi pretendere la cifra, sui
    # VOCALI no — la trascrizione scrive "tre casse", non "3 casse".
    # ------------------------------------------------------------
