# ============================================================
#  CHAT ORDINI: VOCALI
#
#  Identico all'esempio 10, ma per i vocali. Due differenze che contano:
#
#   1. `type: audio` invece di `text`
#   2. `transcribe: true`, e nelle azioni si usa {{transcript}}
#
#  E una trappola: il pattern NON deve pretendere una cifra davanti alla
#  parola. La trascrizione scrive i numeri a parole — "servono tre casse",
#  non "servono 3 casse" — quindi '\d+\s*(casse)' non matcherebbe mai.
# ============================================================

rules:
  - id: ordini-vocali
    name: "Ordini — vocali con parole chiave"
    priority: 11
    enabled: false

    match:
      chatName: Ordini
      type: audio
      textMatch:
        mode: regex
        flags: iu
        patterns:
          - '(?<![\p{L}\p{N}])(casse|cartoni|bottiglie|pezzi|kg|chili|porta\w*)(?![\p{L}\p{N}])'

    transcribe: true

    actions:
      - type: appendJsonl
        file: data/ordini.jsonl
      - type: notify.telegram
        message: |
          🎙️ Ordine vocale in {{chat}} da {{sender}}:
          {{transcript}}

    # `porta\w*` prende "portate", "portare", "portato" — comodo perché
    # negli ordini a voce si usa spesso il verbo. Il rovescio: prende anche
    # "portafoglio". Se dà fastidio, elenca le forme che ti servono:
    #   port(a|are|ate|ato|ata|ati|o|i|iamo)
    #
    # NOTA sui gruppi di cattura: qui sopra le parentesi sono un semplice
    # raggruppamento, quindi non creano segnaposto. Se invece usi
    # (?<nome>...) puoi riusare la parola nelle azioni:
    #   entityId: "light.{{stanza}}"
    # Vedi l'esempio 06.

    # PER PROVARE senza registrare un vocale, dal pannello web trascini
    # un file audio nel campo di prova. Oppure da riga di comando:
    #   node tools/prova-trascrizione.mjs "servono tre casse di rosso" "Ordini" "Mario"
