# ============================================================
#  NOTE A TE STESSO
#
#  Quello che scrivi nella chat con te stesso finisce dove vuoi.
#  È il modo più comodo per provare tutto il giro senza disturbare
#  nessuno: ti scrivi, e vedi se le regole fanno quello che pensavi.
#
#  RICHIEDE in config/rules.yaml:
#      settings:
#        processOwnMessages: true
#  senza quello i tuoi messaggi vengono ignorati prima di tutto il resto.
# ============================================================

rules:
  - id: note-a-me-stesso
    name: "Note a me stesso"
    priority: 200
    enabled: false

    match:
      senderJid: "@me"          # solo io
      type: [text, audio]

    transcribe: true

    actions:
      - type: notify.console
        message: "📝 {{content}}"
      - type: appendJsonl
        file: data/note.jsonl

    # `@me` vale per il tuo account in qualunque forma WhatsApp te lo
    # presenti (numero o @lid). Se preferisci l'esplicito:
    #   senderJid: "393331234567@s.whatsapp.net"
    # e `npm run contacts` ti dice le forme che conosce.
    #
    # Per andare su Telegram invece che a video:
    #   - type: notify.telegram
    #     message: "📝 {{content}}"
