# ============================================================
#  CLASSIFICAZIONE: L'LLM DECIDE DI COSA SI PARLA
#
#  Due regole sullo stesso messaggio: la prima che passa il
#  classificatore vince. Se la prima viene scartata, si prova la
#  seconda — è così che "lavoro" e "chiacchiere" finiscono in posti
#  diversi invece che tutti insieme.
#
#  Richiede OPENAI_API_KEY in .env. Con Groq: openai/gpt-oss-120b.
#  Ogni messaggio che arriva a una di queste regole costa una chiamata.
# ============================================================

rules:
  - id: vocali-di-lavoro
    name: "Mario — vocali di lavoro"
    priority: 80
    enabled: false

    match:
      chatName: Mario
      type: audio

    transcribe: true
    classify:
      labels: [lavoro]
      minConfidence: 0.7
      model: openai/gpt-oss-120b

    actions:
      - type: notify.telegram
        message: "💼 *{{label}}* ({{confidence}})\n{{transcript}}"
      - type: appendJsonl
        file: data/lavoro.jsonl

  - id: vocali-non-di-lavoro
    name: "Mario — vocali non di lavoro"
    priority: 81
    enabled: false

    match:
      chatName: Mario
      type: audio

    transcribe: true
    classify:
      labels: [chiacchiere, spam]
      minConfidence: 0.7
      model: openai/gpt-oss-120b

    actions:
      - type: appendJsonl
        file: data/chiacchiere.jsonl

    # ------------------------------------------------------------
    # COME SI COMPORTA IL FILTRO
    #
    # - se l'etichetta non è tra quelle elencate, la regola non scatta
    # - se la confidenza è sotto minConfidence, non scatta
    # - se la chiamata all'LLM FALLISCE (rete, quota, modello
    #   inesistente) la regola NON filtra: meglio un falso positivo
    #   che un ordine perso. Nel log vedi "classificazione fallita".
    # - {{label}} e {{confidence}} sono disponibili nelle azioni
    # ------------------------------------------------------------
