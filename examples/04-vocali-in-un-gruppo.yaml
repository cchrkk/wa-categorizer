# ============================================================
#  VOCALI IN UN GRUPPO, FILTRATI SUL CONTENUTO
#
#  Il gruppo si sceglie per nome; `isGroup: true` esclude le chat 1:1
#  (senza, "Famiglia" prenderebbe anche un contatto con quel nome).
#
#  Serve a non farsi sommergere: in un gruppo si parla di tutto, e qui
#  passano solo i vocale che contengono le parole che ti interessano.
# ============================================================

rules:
  - id: gruppo-vocali-importanti
    name: "Gruppo — vocali filtrati"
    priority: 90
    enabled: false

    match:
      isGroup: true
      chatName: Famiglia       # "contiene": prende anche "Famiglia 🏠"
      type: audio
      textMatch:
        mode: contains
        patterns: [cena, ritardo, ospedale, ritiro, scuola, bolletta]

    transcribe: true

    actions:
      - type: notify.telegram
        message: |
          👨‍👩‍👧 in *{{chat}}* — {{sender}}:
          {{transcript}}

    # ------------------------------------------------------------
    # NOME DEL GRUPPO: tre modi, dal più comodo al più solido
    #
    # 1. contiene (sopra): se il gruppo si chiama "Famiglia 🏠" funziona
    #    comunque, ma "Famiglia allargata" verrebbe preso pure.
    #
    # 2. regex, se hai più gruppi che ti interessano:
    #      chatName:
    #        mode: regex
    #        flags: iu
    #        patterns: ['(?<![\p{L}\p{N}])(famiglia|parenti|zii)(?![\p{L}\p{N}])']
    #
    # 3. jid: quello non cambia mai, nemmeno se rinomini il gruppo.
    #    Per i gruppi finisce in @g.us, lo trovi in data/messages.jsonl
    #    o nel pannello web provando un messaggio:
    #      chatJid: "120363000000000000@g.us"
    # ------------------------------------------------------------
