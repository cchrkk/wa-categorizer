# ==============================================================
#  wa-categorizer — stack Docker "generico"
#
#  Per un host qualsiasi: costruisce l'immagine da questo repo.
#  Su dkct NON si usa questo file (vedi deploy/dkct/): lì il build via
#  Dockhand non funziona e serve `deploy/dkct/compose.yaml`.
#
#  L'app NON ascolta su nessuna porta, a parte il pannello web se lo accendi.
#  Niente `ports:` per il resto: Docker bypassa UFW, quindi non pubblicare
#  nulla è la difesa più semplice.
# ==============================================================

services:
  wa-categorizer:
    build:
      context: .
    image: wa-categorizer:latest
    container_name: wa-categorizer
    restart: unless-stopped

    # Ha già tini come entrypoint: i segnali arrivano a node e il salvataggio
    # su disco (regole, rubrica, stato) va a termine.
    stop_grace_period: 20s

    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      AUTH_DIR: /app/data/auth
      TZ: Europe/Rome
      LOG_PRETTY: "false"
      LOG_LEVEL: info
      WEB_BIND: 0.0.0.0

    # Pannello web: apri questa porta solo se WEB_ENABLED=true.
    #   127.0.0.1  solo questa macchina (default, sicuro)
    #   0.0.0.0    visibile sulla LAN
    ports:
      - "${WEB_PUBLISH_IP:-127.0.0.1}:${WEB_PORT:-8099}:${WEB_PORT:-8099}"

    volumes:
      # sessione WhatsApp, log, media, rubrica
      - wa-data:/app/data
      # regole fuori dall'immagine: ricarica a caldo, niente rebuild
      - ./config:/app/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa-data:
