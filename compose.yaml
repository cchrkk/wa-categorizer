# ==============================================================
#  wa-categorizer — generic Docker stack
#
#  For any host: it builds the image from this repository.
#  On hosts where the Docker agent cannot build (read-only /root), use a
#  prebuilt image instead — see docs/install.md.
#
#  The app listens on no port, except the web panel if you turn it on.
#  Keep it that way: Docker bypasses UFW, so publishing nothing is the
#  simplest defence.
# ==============================================================

services:
  wa-categorizer:
    build:
      context: .
    image: wa-categorizer:latest
    container_name: wa-categorizer
    restart: unless-stopped

    # tini is already the image entrypoint: signals reach node, so rules,
    # contacts and state are saved before the process exits.
    stop_grace_period: 20s

    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      AUTH_DIR: /app/data/auth
      TZ: Europe/Rome
      LOG_PRETTY: "false"
      LOG_LEVEL: info
      WEB_BIND: 0.0.0.0

    # Web panel: open this port only if WEB_ENABLED=true.
    #   127.0.0.1  this machine only (default, safe)
    #   0.0.0.0    reachable on the LAN
    ports:
      - "${WEB_PUBLISH_IP:-127.0.0.1}:${WEB_PORT:-8099}:${WEB_PORT:-8099}"

    volumes:
      # WhatsApp session, logs, media, contacts
      - wa-data:/app/data
      # rules stay outside the image: edit and reload, no rebuild
      - ./config:/app/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa-data:
